name: CI backend

# Corre en cada Pull Request que toque el backend, antes de poder mergear a main.
# Chequea que el código instale y cargue sin errores (detecta imports rotos,
# errores de sintaxis, etc. — el tipo de bug que antes solo se veía al fallar
# el deploy en Railway).
#
# Nota: los tests de integración (npm test) hoy corren contra la base de
# datos real de producción (no hay base de datos de prueba separada), así
# que NO se ejecutan acá automáticamente para no escribir datos de prueba
# en producción. Si en el futuro se arma una base de datos de prueba, se
# puede agregar un secreto TEST_DATABASE_URL y correr "npm test" acá.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de todos los archivos fuente
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: npm audit (solo reporta, no bloquea el merge)
        run: npm audit --production || true
