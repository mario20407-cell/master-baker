name: CI backend

# Corre en cada Pull Request que toque el backend, antes de poder mergear a main.
# Chequea que el código instale y cargue sin errores (detecta imports rotos,
# errores de sintaxis, etc. — el tipo de bug que antes solo se veía al fallar
# el deploy en Railway) y corre la suite de tests de integración contra una
# base de Postgres efímera creada para cada corrida (no toca producción).

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: master_baker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-no-es-el-de-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de todos los archivos fuente
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Cargar esquema en la base de datos de test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d master_baker_test -v ON_ERROR_STOP=1 -f src/db/schema.sql

      # app_conn replica el perfil de privilegios del rol "postgres" de
      # Supabase en producción: BYPASSRLS + CREATEROLE, pero NO superusuario.
      # Un superusuario puede SET ROLE a cualquier rol sin necesitar
      # membresía explícita — eso es justo lo que hacía que este CI nunca
      # detectara el incidente real del 2026-07-31 (faltaba el GRANT de
      # membresía de app_tenant_scoped). Con app_conn como rol de conexión,
      # SET LOCAL ROLE (ver db/client.js) sí depende de esa membresía real.
      #
      # REASSIGN OWNED BY transfiere la propiedad de todo lo creado por
      # postgres (tablas, secuencias) a app_conn, para que app_conn pueda
      # hacer GRANT sobre esos objetos sin haber ejecutado él mismo el DDL
      # de schema.sql — evita que "uuid-ossp" (que requiere superusuario
      # para CREATE EXTENSION) bloquee el approach.
      - name: Crear rol de conexión restringido (app_conn) y transferir ownership
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d master_baker_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_conn WITH LOGIN CREATEROLE BYPASSRLS PASSWORD 'app_conn_ci_pw';
          GRANT USAGE, CREATE ON SCHEMA public TO app_conn;
          REASSIGN OWNED BY postgres TO app_conn;
          SQL

      - name: Correr tests de integración (contra la DB de test, no producción)
        env:
          # Rol restringido (ver paso anterior) — NO postgres/superuser. Con
          # RLS_TENANT_ENFORCE=true, tenantQuery.test.js exige este env y
          # ejercita el camino real de producción: si el GRANT de membresía
          # de app_tenant_scoped (backend/src/db/rlsSetup.js) se rompe, esta
          # suite falla en rojo de inmediato.
          DATABASE_URL: postgresql://app_conn:app_conn_ci_pw@localhost:5432/master_baker_test
          RLS_TENANT_ENFORCE: 'true'
        run: npm test

      - name: Guard — queries a tablas por-tenant sin filtrar tenant_id
        run: npm run guard:tenant-id

      - name: npm audit (solo reporta, no bloquea el merge)
        run: npm audit --production || true
